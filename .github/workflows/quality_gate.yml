name: Strict Quality Gate

on:
  push:
    branches: [ main, master, "feature/*", "refactor/*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system audio libraries (PortAudio & libsndfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libsndfile1

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Pytest Test Suite
        run: uv run python script/check_quality_gate.py --step pytest

      - name: Check Ruff Baseline
        run: uv run python script/check_quality_gate.py --step ruff

      - name: Check Mypy Baseline
        run: uv run python script/check_quality_gate.py --step mypy
