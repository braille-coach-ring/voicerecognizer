[project]
name = "voicerecognizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "librosa>=0.11.0",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "scikit-learn>=1.9.0",
    "sounddevice>=0.5.5",
    "soundfile>=0.14.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.44.0",
    "tqdm>=4.68.4",
    "python-dotenv>=1.2.2",
    "onnxruntime>=1.19.0",
    "onnx>=1.22.0",
    "onnxscript>=0.7.1",
    "accelerate>=1.11.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124", marker = "sys_platform != 'darwin'" }
torchvision = { index = "pytorch-cu124", marker = "sys_platform != 'darwin'" }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"voicerecognizer" = "."


